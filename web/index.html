<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sort Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Sort Visualizer</h1>
    <select id="algorithm-select" aria-label="Sort algorithm">
      <option value="bubble">Bubble Sort</option>
      <option value="insertion">Insertion Sort</option>
      <option value="selection">Selection Sort</option>
      <option value="merge">Merge Sort</option>
      <option value="quick">Quick Sort</option>
      <option value="heap">Heap Sort</option>
    </select>
  </header>

  <div class="controls">
    <label class="control">
      <span class="control-label">Speed</span>
      <input type="range" id="speed-slider" min="1" max="100" value="55" />
    </label>
    <label class="control">
      <span class="control-label">Size</span>
      <input type="range" id="size-slider" min="10" max="200" value="60" />
    </label>
    <button id="shuffle-btn" class="btn" type="button" aria-label="Shuffle array">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 3 21 3 21 8"></polyline>
        <line x1="4" y1="20" x2="21" y2="3"></line>
        <polyline points="21 16 21 21 16 21"></polyline>
        <line x1="15" y1="15" x2="21" y2="21"></line>
        <line x1="4" y1="4" x2="9" y2="9"></line>
      </svg>
    </button>
    <button id="play-btn" class="btn btn-play" type="button" aria-label="Play">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <polygon points="6 3 21 12 6 21"></polygon>
      </svg>
    </button>
  </div>

  <main class="viz-container">
    <canvas id="viz-canvas"></canvas>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
