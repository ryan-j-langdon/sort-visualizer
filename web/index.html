<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sort Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Sort Visualizer</h1>
    <div class="topbar-actions">
      <select id="algorithm-select" aria-label="Sort algorithm">
        <option value="bubble">Bubble Sort</option>
        <option value="insertion">Insertion Sort</option>
        <option value="selection">Selection Sort</option>
        <option value="merge">Merge Sort</option>
        <option value="quick">Quick Sort</option>
        <option value="heap">Heap Sort</option>
      </select>
      <button id="mute-btn" class="icon-btn btn-mute" type="button" aria-label="Mute sound effects" title="Mute">
        <svg class="icon-sound-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <svg class="icon-sound-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
    </div>
  </header>

  <div class="controls">
    <label class="control">
      <span class="control-label">Speed</span>
      <span class="slider-tooltip" id="speed-tooltip" aria-hidden="true"></span>
      <input type="range" id="speed-slider" min="1" max="100" value="55" />
    </label>
    <label class="control">
      <span class="control-label">Size</span>
      <span class="slider-tooltip" id="size-tooltip" aria-hidden="true"></span>
      <input type="range" id="size-slider" min="10" max="200" value="60" />
    </label>
    <button id="shuffle-btn" class="btn" type="button" aria-label="Shuffle array" title="Shuffle">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 3 21 3 21 8"></polyline>
        <line x1="4" y1="20" x2="21" y2="3"></line>
        <polyline points="21 16 21 21 16 21"></polyline>
        <line x1="15" y1="15" x2="21" y2="21"></line>
        <line x1="4" y1="4" x2="9" y2="9"></line>
      </svg>
    </button>
    <button id="play-btn" class="btn btn-play" type="button" aria-label="Play" title="Play">
      <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <polygon points="6 3 21 12 6 21"></polygon>
      </svg>
      <svg class="icon-finish" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <polygon points="2.5 5 11.5 12 2.5 19"></polygon>
        <polygon points="12.5 5 21.5 12 12.5 19"></polygon>
      </svg>
    </button>
  </div>

  <main class="viz-container">
    <canvas id="viz-canvas"></canvas>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
